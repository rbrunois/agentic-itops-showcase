<defs>
  <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0969da"/><stop offset=".55" stop-color="#0598bc"/><stop offset="1" stop-color="#8250df"/></linearGradient>
