<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"
     role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Architecture Writer evidence and review workflow</title>
  <desc id="workflow-desc">Azure inventory and telemetry flow through read-only discovery, an SRE Agent relationship model, documentation and validation automation tasks, GitHub branch synchronization, human review, and an approved baseline. A scheduled drift loop returns to Azure discovery. Optional infrastructure as code remains approval gated.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#315f86"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1e7a5b"/>
    </marker>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #526b80; }
      .group-title { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .box-title { font: 700 15px "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .body { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #345066; }
      .small { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #526b80; }
      .arrow { fill: none; stroke: #315f86; stroke-width: 2.5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #1e7a5b; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#page)"/>
  <text x="56" y="52" class="title">Architecture Writer: evidence to approved baseline</text>
  <text x="56" y="78" class="subtitle">Read-only discovery, explicit confidence, approval-gated proposals, and reviewable GitHub synchronization</text>

  <g filter="url(#shadow)">
    <rect x="44" y="118" width="220" height="430" rx="18" fill="#e7f3ff" stroke="#6da9dc" stroke-width="2"/>
    <rect x="286" y="118" width="250" height="430" rx="18" fill="#eeeafd" stroke="#8875cf" stroke-width="2"/>
    <rect x="558" y="118" width="300" height="430" rx="18" fill="#e8f7f1" stroke="#58a98b" stroke-width="2"/>
    <rect x="880" y="118" width="170" height="430" rx="18" fill="#fff2dd" stroke="#d89a45" stroke-width="2"/>
    <rect x="1072" y="118" width="164" height="430" rx="18" fill="#f5ebf4" stroke="#ac6aa4" stroke-width="2"/>
  </g>

  <text x="68" y="153" class="group-title">Azure</text>
  <rect x="68" y="178" width="172" height="88" rx="12" fill="#fff" stroke="#6da9dc"/>
  <text x="84" y="205" class="box-title">Inventory</text>
  <text x="84" y="230" class="body">Resources, regions,</text>
  <text x="84" y="250" class="body">groups, networks</text>
  <rect x="68" y="286" width="172" height="88" rx="12" fill="#fff" stroke="#6da9dc"/>
  <text x="84" y="313" class="box-title">Telemetry evidence</text>
  <text x="84" y="338" class="body">Health, dependencies,</text>
  <text x="84" y="358" class="body">DNS and change data</text>
  <rect x="68" y="400" width="172" height="112" rx="12" fill="#d8ebfb" stroke="#6da9dc"/>
  <text x="84" y="427" class="box-title">Read-only boundary</text>
  <text x="84" y="452" class="body">Least privilege</text>
  <text x="84" y="472" class="body">Scoped queries</text>
  <text x="84" y="492" class="body">No Azure mutation</text>

  <text x="310" y="153" class="group-title">SRE Agent</text>
  <rect x="310" y="178" width="202" height="88" rx="12" fill="#fff" stroke="#8875cf"/>
  <text x="326" y="205" class="box-title">Read-only discovery</text>
  <text x="326" y="230" class="body">Capture evidence, scope,</text>
  <text x="326" y="250" class="body">timestamp and provenance</text>
  <rect x="310" y="286" width="202" height="118" rx="12" fill="#fff" stroke="#8875cf"/>
  <text x="326" y="313" class="box-title">Relationship model</text>
  <circle cx="327" cy="339" r="5" fill="#2672b8"/>
  <text x="341" y="344" class="body">Observed</text>
  <circle cx="327" cy="365" r="5" fill="#c17d17"/>
  <text x="341" y="370" class="body">Inferred + confidence</text>
  <circle cx="327" cy="391" r="5" fill="#7a5bc0"/>
  <text x="341" y="396" class="body">Proposed</text>
  <rect x="310" y="424" width="202" height="88" rx="12" fill="#dfd8f7" stroke="#8875cf"/>
  <text x="326" y="451" class="box-title">Unknowns remain visible</text>
  <text x="326" y="476" class="body">No invented links, flows,</text>
  <text x="326" y="496" class="body">resiliency or success</text>

  <text x="582" y="153" class="group-title">SRE automation tasks</text>
  <rect x="582" y="178" width="252" height="86" rx="12" fill="#fff" stroke="#58a98b"/>
  <text x="598" y="205" class="box-title">Diagram + documentation</text>
  <text x="598" y="230" class="body">SVG / Mermaid / draw.io</text>
  <text x="598" y="250" class="body">Inventory, boundaries and flows</text>
  <rect x="582" y="282" width="252" height="86" rx="12" fill="#fff" stroke="#58a98b"/>
  <text x="598" y="309" class="box-title">Consistency + WAF review</text>
  <text x="598" y="334" class="body">Coverage, contradictions,</text>
  <text x="598" y="354" class="body">unknowns and recommendations</text>
  <rect x="582" y="386" width="252" height="86" rx="12" fill="#fff" stroke="#58a98b"/>
  <text x="598" y="413" class="box-title">Optional IaC draft</text>
  <text x="598" y="438" class="body">Terraform or Bicep proposal</text>
  <text x="598" y="458" class="body">Approval gated; never applied</text>
  <rect x="582" y="488" width="252" height="38" rx="10" fill="#d7f0e6" stroke="#58a98b"/>
  <text x="598" y="512" class="small">Scheduled/on-demand drift check</text>

  <text x="904" y="153" class="group-title">GitHub sync</text>
  <rect x="904" y="178" width="122" height="112" rx="12" fill="#fff" stroke="#d89a45"/>
  <text x="920" y="205" class="box-title">Branch</text>
  <text x="920" y="230" class="body">Sanitized</text>
  <text x="920" y="250" class="body">artifacts</text>
  <text x="920" y="270" class="body">and drift</text>
  <rect x="904" y="312" width="122" height="112" rx="12" fill="#fff" stroke="#d89a45"/>
  <text x="920" y="339" class="box-title">Pull request</text>
  <text x="920" y="364" class="body">Checks, owners,</text>
  <text x="920" y="384" class="body">unknowns and</text>
  <text x="920" y="404" class="body">review gates</text>
  <rect x="904" y="448" width="122" height="64" rx="12" fill="#ffe6bd" stroke="#d89a45"/>
  <text x="920" y="475" class="box-title">No auto-merge</text>
  <text x="920" y="496" class="body">No direct push</text>

  <text x="1096" y="153" class="group-title">Human review</text>
  <rect x="1096" y="178" width="116" height="112" rx="12" fill="#fff" stroke="#ac6aa4"/>
  <text x="1112" y="205" class="box-title">Owners</text>
  <text x="1112" y="230" class="body">Cloud</text>
  <text x="1112" y="250" class="body">Network</text>
  <text x="1112" y="270" class="body">Security + app</text>
  <rect x="1096" y="312" width="116" height="112" rx="12" fill="#fff" stroke="#ac6aa4"/>
  <text x="1112" y="339" class="box-title">Decision</text>
  <text x="1112" y="364" class="body">Approve</text>
  <text x="1112" y="384" class="body">Revise</text>
  <text x="1112" y="404" class="body">Reject</text>
  <rect x="1096" y="448" width="116" height="64" rx="12" fill="#ecd5e9" stroke="#ac6aa4"/>
  <text x="1112" y="475" class="box-title">Baseline</text>
  <text x="1112" y="496" class="body">Approved state</text>

  <path d="M240 222 H310" class="arrow"/>
  <path d="M240 330 C270 330 274 222 310 222" class="arrow"/>
  <path d="M512 345 H582" class="arrow"/>
  <path d="M834 325 H904" class="arrow"/>
  <path d="M1026 368 H1096" class="arrow"/>
  <path d="M1154 424 V448" class="arrow"/>
  <path d="M708 368 V386" class="arrow"/>

  <rect x="56" y="584" width="1168" height="112" rx="16" fill="#fff" stroke="#79a78f" stroke-width="2"/>
  <text x="80" y="616" class="group-title">Feedback and drift loop</text>
  <text x="80" y="644" class="body">An approved schedule or on-demand task compares fresh read-only evidence with the GitHub baseline.</text>
  <text x="80" y="668" class="body">Azure drift, evidence drift, documentation drift, and proposed state remain distinct; every update returns through human review.</text>
  <path d="M1154 548 V568 C1154 576 1146 584 1138 584" class="feedback"/>
  <path d="M80 584 C56 584 44 572 44 548 V330 C44 310 52 300 68 300" class="feedback"/>
  <text x="938" y="572" class="small" fill="#1e7a5b">approved baseline triggers future comparison</text>
</svg>
