<svg xmlns="http://www.w3.org/2000/svg" width="528" height="579.6" viewBox="0 0 880 966" role="img" aria-labelledby="title description">
  <title id="title">How an investigation flows</title>
  <desc id="description">Incident reported, then short intake with 3-5 targeted questions, fresh evidence gathering, and correlation of symptoms to causes. Is the root cause confirmed? Yes leads to RCA + Remediation Steps. No leads to the best-supported hypothesis and the next discriminating check. Both branches lead to an offer of an RCA report, on approval only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; text-anchor: middle; }
      .heading { fill: #172033; font-size: 21px; font-weight: 600; }
      .detail { fill: #475569; font-size: 17px; }
      .light { fill: #ffffff; }
      .light-detail { fill: #e0f2fe; }
      .branch-label { fill: #334155; font-size: 18px; font-weight: 600; }
      .step { fill: #ffffff; stroke: #b4c6d8; stroke-width: 1.5; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .merge { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="880" height="966" rx="20" fill="#f8fafc"/>

  <g aria-label="Flow connections">
    <path class="connector" d="M440 96V128"/>
    <path class="connector" d="M440 208V240"/>
    <path class="connector" d="M440 332V364"/>
    <path class="connector" d="M440 444V480"/>
    <path class="connector" d="M320 550H220V678"/>
    <path class="connector" d="M560 550H660V678"/>
    <path class="merge" d="M220 774V822H660V774"/>
    <path class="connector" d="M440 822V854"/>
    <circle cx="440" cy="822" r="4" fill="#64748b"/>
    <text class="branch-label" x="270" y="533">Yes</text>
    <text class="branch-label" x="610" y="533">No</text>
  </g>

  <g aria-label="Incident reported">
    <rect x="240" y="32" width="400" height="64" rx="12" fill="#0067b8"/>
    <text class="heading light" x="440" y="72">Incident reported</text>
  </g>

  <g aria-label="Short intake">
    <rect class="step" x="240" y="128" width="400" height="80" rx="12"/>
    <text class="heading" x="440" y="161">Short intake</text>
    <text class="detail" x="440" y="187">3-5 targeted questions</text>
  </g>

  <g aria-label="Gather fresh evidence">
    <rect class="step" x="200" y="240" width="480" height="92" rx="12"/>
    <text class="heading" x="440" y="276">Gather fresh evidence</text>
    <text class="detail" x="440" y="305">docs · telemetry · logs · metrics · deploys</text>
  </g>

  <g aria-label="Correlate symptoms to causes">
    <rect class="step" x="240" y="364" width="400" height="80" rx="12"/>
    <text class="heading" x="440" y="397">Correlate symptoms</text>
    <text class="detail" x="440" y="423">to causes</text>
  </g>

  <g aria-label="Root cause confirmed?">
    <path d="M440 480 560 550 440 620 320 550Z" fill="#eff6ff" stroke="#0078d4" stroke-width="2"/>
    <text class="heading" x="440" y="544">Root cause</text>
    <text class="heading" x="440" y="570">confirmed?</text>
  </g>

  <g aria-label="Confirmed root cause">
    <rect x="40" y="678" width="360" height="96" rx="12" fill="#f0fdf4" stroke="#22834a" stroke-width="1.5"/>
    <text class="heading" x="220" y="720">RCA + Remediation Steps</text>
    <text class="detail" x="220" y="748">Root cause confirmed</text>
  </g>

  <g aria-label="Unconfirmed root cause">
    <rect x="480" y="678" width="360" height="96" rx="12" fill="#fffbeb" stroke="#b7791f" stroke-width="1.5"/>
    <text class="heading" x="660" y="720">Best-supported hypothesis</text>
    <text class="detail" x="660" y="748">+ next discriminating check</text>
  </g>

  <g aria-label="Offer RCA Report on approval only">
    <rect x="240" y="854" width="400" height="80" rx="12" fill="#0067b8"/>
    <text class="heading light" x="440" y="887">Offer RCA Report</text>
    <text class="detail light-detail" x="440" y="913">on approval only</text>
  </g>
</svg>
