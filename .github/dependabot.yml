version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /Tools/azure-sre-incident-response/app
      - /scripts/site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directories:
      - /Tools/microsoft-fabric-monitoring
      - /Tools/microsoft-fabric-monitoring/services/fabric-admin-mcp
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /Tools/azure-sre-incident-response/app
      - /Tools/microsoft-fabric-monitoring/services/fabric-admin-mcp
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
