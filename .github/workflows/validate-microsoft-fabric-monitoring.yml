name: Validate Microsoft Fabric monitoring

on:
  push:
    paths:
      - "Tools/microsoft-fabric-monitoring/**"
      - ".github/workflows/validate-microsoft-fabric-monitoring.yml"
  pull_request:
    paths:
      - "Tools/microsoft-fabric-monitoring/**"
      - ".github/workflows/validate-microsoft-fabric-monitoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tests, Ruff, and PBIR validation
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Tools/microsoft-fabric-monitoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]" -r services/fabric-admin-mcp/requirements.txt

      - name: Install Power BI report authoring CLI
        run: npm install -g @microsoft/powerbi-report-authoring-cli@0.5.0

      - name: Validate package
        shell: pwsh
        run: ./scripts/validate.ps1
