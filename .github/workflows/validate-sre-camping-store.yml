name: Validate Azure SRE Camping Store

on:
  push:
    paths:
      - "Tools/azure-sre-camping-store/**"
      - "docs/azure-sre-camping-store/**"
      - ".github/workflows/validate-sre-camping-store.yml"
  pull_request:
    paths:
      - "Tools/azure-sre-camping-store/**"
      - "docs/azure-sre-camping-store/**"
      - ".github/workflows/validate-sre-camping-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Application, operator, infrastructure, and container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Tools/azure-sre-camping-store
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Tools/azure-sre-camping-store/src/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test operator safety and onboarding with mocks
        run: python -m unittest discover -s tests -v

      - name: Test API
        run: dotnet test src/api.tests/CampingApi.Tests.csproj --nologo

      - name: Build frontend
        run: npm --prefix src/frontend ci && npm --prefix src/frontend run build

      - name: Compile Bicep without deployment
        run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/camping-sre.json"

      - name: Build containers without publishing
        run: |
          docker build --tag camping-api:ci src/api
          docker build --tag camping-frontend:ci src/frontend
