name: Publish site

# Builds the landing page and one page per use case (from each Tools/<use-case>/README.md)
# and deploys them to GitHub Pages. Pull requests only build, so a broken page or a use
# case missing from the README catalogue fails the check before it merges.
on:
  push:
    branches: [main]
    paths:
      - "Tools/**"
      - "docs/**"
      - "scripts/site/**"
      - "README.md"
      - ".github/workflows/publish-site.yml"
  pull_request:
    paths:
      - "Tools/**"
      - "docs/**"
      - "scripts/site/**"
      - "README.md"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/site/package-lock.json

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        working-directory: scripts/site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
