  <text x="1154" y="1073" class="body">Operator-selected resource group</text>
  <text x="1154" y="1106" class="body">Queries the Log Analytics workspace</text>
  <text x="1154" y="1132" class="detail">Correlates VM, app, SQL, and operator events</text>
  <text x="1154" y="1158" class="detail">Investigation and root-cause analysis</text>

  <text x="48" y="1215" class="detail">Telemetry: AMA sends directly to Log Analytics; the DCR is configuration, not a network hop. Heartbeat is emitted by AMA.</text>
