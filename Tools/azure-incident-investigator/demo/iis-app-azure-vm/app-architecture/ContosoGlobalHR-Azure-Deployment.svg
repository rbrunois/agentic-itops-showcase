      .name { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .detail { font-size: 12px; fill: #526474; }
      .label { font-size: 12px; font-weight: 700; fill: #2563a0; }
      .muted { fill: #526474; }
      .boundary { fill: #fff; stroke: #c4d0d9; stroke-width: 1.5; }
      .rule { stroke: #dce4ea; stroke-width: 1; }
      .traffic { fill: none; stroke: #2563a0; stroke-width: 2; marker-end: url(#arrow); }
      .peering { fill: none; stroke: #2563a0; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .telemetry { fill: none; stroke: #238269; stroke-width: 3; stroke-dasharray: 6 5; marker-end: url(#green-arrow); }
      .policy { fill: none; stroke: #ac6500; stroke-width: 2; stroke-dasharray: 3 5; }
      .inverse { fill: #fff; }
      .shared { fill: #e0edfa; stroke: #4385bd; }
      .production { fill: #ffedf0; stroke: #c44460; }
      .nonproduction { fill: #def3e9; stroke: #21845d; }
      .production-vm { fill: #f4bfca; stroke: #cb5b74; }
      .nonproduction-vm { fill: #a8ddc4; stroke: #32976b; }
      .telemetry-label { font-size: 14px; font-weight: 700; fill: #176747; }
