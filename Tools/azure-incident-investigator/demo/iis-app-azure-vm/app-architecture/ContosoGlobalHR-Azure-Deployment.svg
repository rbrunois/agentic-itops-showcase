<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1390" viewBox="0 0 1600 1390" role="img" aria-labelledby="title desc">
  <title id="title">Contoso Global HR - Azure deployment architecture</title>
  <desc id="desc">Documented deployment in Canada Central. A blue shared hub with Azure Bastion peers with red production and green non-production virtual networks. Each environment has a workstation, IIS web server, and SQL Server. Azure Monitor Agent on all three VMs in each environment sends telemetry to the same teal Log Analytics workspace. A shared DCR defines collection and the workspace destination; the SRE Agent queries this workspace. Addresses and workspace placement reflect the older runbook deployment, not a live Azure inventory or the newer repository configuration.</desc>
