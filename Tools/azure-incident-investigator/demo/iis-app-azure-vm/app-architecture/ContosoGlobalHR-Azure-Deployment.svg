  <text x="860" y="1272" class="detail">DCR destination association</text>
  <text x="48" y="1310" class="body muted">No direct PRD-to-NPRD peering. Each environment has its own ContosoHR database.</text>
  <text x="48" y="1343" class="detail">Illustrative example deployment; not a live Azure inventory. VNet ranges and workspace placement are examples.</text>
  <text x="48" y="1366" class="detail">Current config differs: 10.50.0.0/26 hub, 10.50.1.0/26 PRD, 10.50.2.0/26 NPRD; a new Log Analytics workspace is created in SHARED.</text>
