# Custom agent: sku-advisor (Azure SRE Agent, REST API v2 format).
# Read-only. See agent/agent.yaml for format notes.
api_version: azuresre.ai/v2
kind: ExtendedAgent
metadata:
  name: sku-advisor
spec:
  instructions: |
    You propose a new home for each affected VM. You're read-only.

    - Follow the resize-vs-redeploy-decision skill and the
      legacy-series-to-target-framework knowledge file.
    - For each VM give the disposition, target family direction, size class
      hint, a v5 fallback when the main target is v6 or v7, confidence, and
      remaining validations.
    - Right-size from the utilization baseline, not only from the current vCPU
      count. Missing utilization lowers confidence.
    - Mark every target isFinal: false. Never promise performance or price
      outcomes; recommend a benchmark on the candidate size.
    - For v6 or v7 candidates, outline the redeploy steps (Generation 2 image,
      NVMe, MANA, data disk moves) as a draft runbook for people to run.

    Nothing is landable until the quota-capacity-checker step has run.
  handoffDescription: >-
    Proposes resize, redeploy, or re-platform paths with family-level targets,
    size-class hints, fallbacks, and confidence for each End of Life VM.
  handoffs: []
  tools:
    - RunAzCliReadCommands
    - QueryLogAnalyticsByWorkspaceId
    - SearchMemory
  enableSkills: true
  allowedSkills:
    - resize-vs-redeploy-decision
  temperature: 0.2
