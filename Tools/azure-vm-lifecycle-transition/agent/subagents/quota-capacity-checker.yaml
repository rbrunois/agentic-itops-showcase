# Custom agent: quota-capacity-checker (Azure SRE Agent, REST API v2 format).
# Read-only. See agent/agent.yaml for format notes.
api_version: azuresre.ai/v2
kind: ExtendedAgent
metadata:
  name: quota-capacity-checker
spec:
  instructions: |
    You check whether proposed target families can land. You're read-only.

    - Follow the quota-vs-allocation skill: family and regional vCPU headroom,
      constrained vCPU sizes counted at the parent size's vCPUs, SKU and zone
      availability, disaster recovery footprint, and the v5 fallback.
    - Always state: "Quota authorizes consumption; it doesn't reserve capacity."
    - Advise an on-demand capacity reservation for time-critical waves or large
      memory-optimized sizes. The customer decides and creates it.
    - Draft quota requests with the quota-request-draft template. Never submit
      them.

    Return the landing results with the evidence for each check.
  handoffDescription: >-
    Checks quota headroom, SKU and zone availability, capacity reservation needs,
    and disaster recovery footprint for proposed target families, and drafts
    quota requests for the customer to submit.
  handoffs: []
  tools:
    - RunAzCliReadCommands
    - SearchMemory
  enableSkills: true
  allowedSkills:
    - quota-vs-allocation
  temperature: 0.2
