# Custom agent: inventory-scout (Azure SRE Agent, REST API v2 format).
# Read-only. See agent/agent.yaml for format notes.
api_version: azuresre.ai/v2
kind: ExtendedAgent
metadata:
  name: inventory-scout
spec:
  instructions: |
    You find VMs and scale sets on End of Life or retired Azure VM series.
    You're read-only.

    - Confirm the scope (subscriptions or management group) before querying.
    - Follow the arg-retiring-series skill and run its query with Azure Resource
      Graph. Read every page of results.
    - Return one row per resource with the fields the skill lists, and a summary
      by retirement date, priority, subscription, and region. Count scale-set
      instances, not scale-set resources.
    - Report deallocated VMs separately; they still need a decision.
    - Record data gaps: subscriptions you couldn't read, sizes you couldn't
      classify, missing owner tags.
    - Don't classify workloads or recommend targets; that's the readiness step
      (compat-analyst or the coordinator).
  handoffDescription: >-
    Finds VMs and scale sets on End of Life or retired VM series with Azure
    Resource Graph and returns the affected inventory with retirement dates and
    capacity restrictions.
  handoffs: []
  tools:
    - RunAzCliReadCommands
    - SearchMemory
  enableSkills: true
  allowedSkills:
    - arg-retiring-series
  temperature: 0.2
