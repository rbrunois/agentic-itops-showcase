<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Finding End of Life VMs a new home with Azure SRE Agent</title>
  <desc id="desc">Every Azure VM size series moves through four lifecycle stages over time: Current (v6 and v7 general purpose, adopt for new deployments), Extended (v4 and v5, fully supported and the smoothest step), End of Life (v1 to v3 with a retirement date, plan and finish the move), and Retired (VMs can't be created, resized into, or run, and remaining VMs are deallocated). Example VMs on End of Life series, Dsv2 retiring 2028-05-01, Fsv2 retiring 2028-11-15, and Esv3 retiring 2029-11-15, need a new home: v5 for the smoothest move, or v6 and v7 for the latest features through a planned upgrade. Without a plan, VMs stop at the retirement date. Azure SRE Agent runs in the customer's tenant with its own managed identity and finds each VM a new home in four steps: Analyze, Recommend, and Validate, which are read-only, and Automate, which needs a person's approval. A weekly read-only scheduled task rescans, compares, and reports what drifted, and memory keeps decisions and exceptions. Each VM gets a proposed new home with evidence and landing checks. Guardrails: read-only first, people approve every change, no prices, purchases, capacity promises, or quota submissions, and vendor appliances and domain controllers stay manual.</desc>
  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c50f1f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/>
    </marker>
  </defs>
  <style>
